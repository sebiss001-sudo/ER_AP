<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Application Web - ER_AP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS pour l'export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans pb-12">

    <!-- Écran de Connexion Sécurisé -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center space-y-4">
            <div class="w-14 h-14 bg-blue-600 text-white rounded-xl mx-auto flex items-center justify-center text-2xl shadow-lg">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="font-bold text-xl text-slate-900">Connexion Requise</h1>
            <p class="text-sm text-slate-500">Accès sécurisé pour la gestion de vos dépenses.</p>
            <input type="email" id="login-email" placeholder="Courriel" value="s.bissonnette.vcat@gmail.com" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="login-password" placeholder="Mot de passe" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl font-semibold text-sm shadow-md transition">Se connecter</button>
            <p id="auth-error" class="text-red-500 text-xs"></p>
        </div>
    </div>

    <!-- Application Principale -->
    <div id="app-content" class="hidden max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <h1 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-receipt text-blue-600 mr-2"></i>Gestion des Dépenses</h1>
            <button onclick="handleLogout()" class="text-xs font-semibold text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg transition">Déconnexion</button>
        </header>

        <!-- Formulaire de Saisie -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wider">Ajouter une dépense</h2>
            <form id="expense-form" onsubmit="submitExpense(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Date</label>
                    <input type="date" id="exp-date" required class="w-full p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Événement / Motif</label>
                    <input type="text" id="exp-motif" placeholder="ex: Réunion client, Congrès..." required class="w-full p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Montant Total ($)</label>
                    <input type="number" step="0.01" id="exp-amount" placeholder="0.00" oninput="calculateTaxes()" required class="w-full p-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-center pt-6">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="exp-other-province" onchange="calculateTaxes()" class="w-4 h-4 text-blue-600 rounded">
                        <span class="ml-2 text-xs font-medium text-slate-600">Autre province / pays (Pas de TPS/TVQ auto)</span>
                    </label>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">TPS (5%)</label>
                    <input type="number" step="0.01" id="exp-tps" class="w-full p-2.5 border rounded-xl text-sm bg-slate-100" readonly>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">TVQ (9.975%)</label>
                    <input type="number" step="0.01" id="exp-tvq" class="w-full p-2.5 border rounded-xl text-sm bg-slate-100" readonly>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Photo du reçu</label>
                    <input type="file" id="exp-photo" accept="image/*" capture="environment" required class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div class="md:col-span-2 flex justify-end">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold shadow-md transition">Enregistrer la dépense</button>
                </div>
            </form>
        </div>

        <!-- Tableau et Export -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-2">
                <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wider">Historique des dépenses</h2>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-sm transition flex items-center gap-2"><i class="fa-solid fa-file-excel"></i>Exporter pour le comptable (.xlsx)</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs">
                            <th class="p-3 rounded-l-xl">Date</th>
                            <th class="p-3">Événement</th>
                            <th class="p-3">Total ($)</th>
                            <th class="p-3">TPS</th>
                            <th class="p-3">TVQ</th>
                            <th class="p-3">Reçu</th>
                            <th class="p-3 rounded-r-xl">Action</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script de configuration et logique Firebase -->
    <script>
        // Remplacez par vos propres configurations Firebase issues de la console
        const firebaseConfig = {
            apiKey: "AIzaSyD8b4Viivsau6HzgHDHenQGRgP2_bIV0qY",
            authDomain: "erap-66a28.firebaseapp.com",
            projectId: "erap-66a28",
            storageBucket: "erap-66a28.firebasestorage.app",
            messagingSenderId: "131124147434",
            appId: "1:131124147434:web:c89bc9541ae0919cac1393"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        let expensesCache = [];

        // Gestion de l'authentification
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById("auth-modal").classList.add("hidden");
                document.getElementById("app-content").classList.remove("hidden");
                loadExpenses();
                document.getElementById("exp-date").valueAsDate = new Date();
            } else {
                document.getElementById("auth-modal").classList.remove("hidden");
                document.getElementById("app-content").classList.add("hidden");
            }
        });

        function handleLogin() {
            const email = document.getElementById("login-email").value;
            const pass = document.getElementById("login-password").value;
            auth.signInWithEmailAndPassword(email, pass).catch(err => {
                document.getElementById("auth-error").innerText = err.message;
            });
        }

        function handleLogout() {
            auth.signOut();
        }

        // Calcul automatique des taxes québécoises
        function calculateTaxes() {
            const amount = parseFloat(document.getElementById("exp-amount").value) || 0;
            const isOther = document.getElementById("exp-other-province").checked;
            if (isOther) {
                document.getElementById("exp-tps").value = "0.00";
                document.getElementById("exp-tvq").value = "0.00";
            } else {
                const ht = amount / 1.14975;
                document.getElementById("exp-tps").value = (ht * 0.05).toFixed(2);
                document.getElementById("exp-tvq").value = (ht * 0.09975).toFixed(2);
            }
        }

        // Ajout d'une dépense
        async function submitEvent(e) {
            e.preventDefault();
        }

        document.getElementById("expense-form").addEventListener("submit", async function(e) {
            e.preventDefault();
            const date = document.getElementById("exp-date").value;
            const motif = document.getElementById("exp-motif").value;
            const total = parseFloat(document.getElementById("exp-amount").value);
            const tps = parseFloat(document.getElementById("exp-tps").value);
            const tvq = parseFloat(document.getElementById("exp-tvq").value);
            const file = document.getElementById("exp-photo").files[0];

            try {
                const storageRef = storage.ref(`receipts/${Date.now()}_${file.name}`);
                const snapshot = await storageRef.put(file);
                const photoUrl = await snapshot.ref.getDownloadURL();

                await db.collection("expenses").add({
                    date, motif, total, tps, tvq, photoUrl, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                this.reset();
                document.getElementById("exp-date").valueAsDate = new Date();
                loadExpenses();
            } catch (err) {
                alert("Erreur lors de l'enregistrement : " + err.message);
            }
        });

        // Chargement des données
        async function loadExpenses() {
            const tbody = document.getElementById("expenses-table-body");
            tbody.innerHTML = "<tr><td colspan='7' class='p-4 text-center text-slate-400'>Chargement...</td></tr>";
            
            const snapshot = await db.collection("expenses").orderBy("date", "desc").get();
            expensesCache = [];
            tbody.innerHTML = "";

            snapshot.forEach(doc => {
                const item = { id: doc.id, ...doc.data() };
                expensesCache.push(item);

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/80">
                        <td class="p-3">${item.date}</td>
                        <td class="p-3 font-medium text-slate-900">${item.motif}</td>
                        <td class="p-3">${item.total.toFixed(2)} $</td>
                        <td class="p-3">${item.tps.toFixed(2)} $</td>
                        <td class="p-3">${item.tvq.toFixed(2)} $</td>
                        <td class="p-3"><a href="${item.photoUrl}" target="_blank" class="text-blue-600 underline font-medium">Voir</a></td>
                        <td class="p-3"><button onclick="deleteExpense('${item.id}')" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });
        }

        async function deleteExpense(id) {
            if (confirm("Supprimer cette dépense ?")) {
                await db.collection("expenses").doc(id).delete();
                loadExpenses();
            }
        }

        // Export Excel
        function exportToExcel() {
            if (expensesCache.length === 0) {
                alert("Aucune donnée à exporter.");
                return;
            }
            const data = expensesCache.map(exp => ({
                "Date": exp.date,
                "Événement / Motif": exp.motif,
                "Total ($)": exp.total,
                "TPS ($)": exp.tps,
                "TVQ ($)": exp.tvq,
                "Lien Reçu": exp.photoUrl
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Dépenses");
            XLSX.writeFile(wb, "Rapport_Depenses_Comptable.xlsx");
        }
    </script>
</body>
</html>
